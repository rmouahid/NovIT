# Sources RSS/Atom déclaratives de NovIT.
#
# Ajouter une source ici ne nécessite aucun code (voir docs/ADDING_A_SOURCE.md) : elle est
# chargée par src.scrapers.rss.load_rss_sources() et transformée en RssScraper générique.
#
# `category` est purement organisationnel (regroupement dans ce fichier et dans les tests),
# sans effet sur le comportement du scraper.
#
# Champs requis : name (unique), url, domains (>=1, valeurs de config/domains.yaml),
# profiles (>=1, ETUDIANT et/ou INGENIEUR). base_score est optionnel (0.5 par défaut).
#
# Note : certaines sources ne sont pas de simples flux RSS (API JSON, pages HTML) et restent
# des scrapers dédiés en code : HackerNewsScraper, GitHubTrendingScraper, CVEScraper,
# ANSSIScraper, ArxivScraper (ai_blogs.py), RoadmapScraper (training.py).

sources:
  # --- Actualités tech générales ---
  - name: dev_to
    category: actualites
    url: "https://dev.to/feed"
    domains: [dev, formation]
    profiles: [ETUDIANT, INGENIEUR]
    base_score: 0.5

  - name: techcrunch
    category: actualites
    url: "https://techcrunch.com/feed/"
    domains: [dev, ia, ingenierie]
    profiles: [ETUDIANT, INGENIEUR]
    base_score: 0.6

  - name: the_verge
