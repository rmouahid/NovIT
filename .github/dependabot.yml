version: 2
updates:
  # Met à jour les actions GitHub, y compris celles épinglées par SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Dépendances Python (requirements*.txt et pyproject.toml). Les bornes
  # sont des minimums (>=) : Dependabot ne propose une PR que si une version
  # sort de la borne ou corrige une faille. Les mises à jour mineures et
  # correctives sont regroupées pour limiter le bruit (docs/DEPENDENCIES.md).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      mineures-et-correctifs:
        update-types: [minor, patch]
