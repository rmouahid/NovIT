name: Dépendances

# Les dépendances sont déclarées avec des bornes basses (>=) : une nouvelle
# version publiée en amont peut casser NovIT sans qu'aucun commit ne change.
# Ce workflow teste chaque semaine les deux extrémités de l'intervalle.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - requirements.txt
      - requirements-dev.txt
      - pyproject.toml
      - .github/workflows/dependencies.yml

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dernières versions publiées de toutes les dépendances.
          - resolution: dernieres
            python: "3.12"
          # Versions minimales déclarées dans requirements.txt, avec des
          # outils de test récents (leurs minimums ne sont pas compatibles
          # entre eux et ne concernent pas les utilisateurs).
          - resolution: minimales
            python: "3.11"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}

      - name: Installer les dernières versions
        if: matrix.resolution == 'dernieres'
        run: |
          uv venv
          uv pip install --upgrade -r requirements-dev.txt

      - name: Installer les versions minimales
        if: matrix.resolution == 'minimales'
        run: |
          uv venv
          uv pip install --resolution lowest-direct -r requirements.txt
          uv pip freeze > /tmp/contraintes.txt
          sed -n '/^# Tests/,/^$/p' requirements-dev.txt | grep -v '^#' > /tmp/outils-test.txt
          uv pip install -r /tmp/outils-test.txt -c /tmp/contraintes.txt

      - name: Versions installées
        run: uv pip freeze

      - name: pytest
        run: .venv/bin/pytest tests/ --benchmark-skip -q
