name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (black, isort, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: black --check
        run: black --check novit tests

      - name: isort --check
        run: isort --check-only --profile black novit tests

      - name: ruff check
        run: ruff check novit tests

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest tests/ --benchmark-skip

      - name: Publier la couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7

  package:
    name: Paquet (build, twine check, installation)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Construire wheel et sdist
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Installer la wheel hors du dépôt et démarrer le serveur
        run: |
          python -m venv /tmp/novit-venv
          /tmp/novit-venv/bin/pip install dist/*.whl
          cd "$RUNNER_TEMP"
          /tmp/novit-venv/bin/novit < /dev/null
          /tmp/novit-venv/bin/python -c "from novit.scrapers.rss import load_rss_sources; assert load_rss_sources()"
