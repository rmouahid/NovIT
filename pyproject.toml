[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "novit"
dynamic = ["version"]
description = "Serveur MCP de veille technologique : actualités, CVE, réglementation et tendances filtrées par profil"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Rayân MOUAHID" }]
keywords = ["mcp", "model-context-protocol", "veille", "technology-watch", "rss", "cve"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
# Identique à requirements.txt (vérifié par tests/test_packaging.py).
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=2.3.0,<3",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.11",
    "lxml>=5.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "cachetools>=5.3.0",
    "loguru>=0.7.0",
    "sentry-sdk>=2.5.0",
    "aiosqlite>=0.20.0",
    "python-dateutil>=2.9.0",
]

[project.scripts]
novit = "novit.mcp.server:run"

[project.urls]
Homepage = "https://github.com/rmouahid/NovIT"
Documentation = "https://github.com/rmouahid/NovIT/tree/main/docs"
Issues = "https://github.com/rmouahid/NovIT/issues"
Changelog = "https://github.com/rmouahid/NovIT/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["novit"]

# Configuration YAML par défaut, utilisée quand ./config/ n'existe pas
# (novit.settings.config_file).
[tool.hatch.build.targets.wheel.force-include]
"config/domains.yaml" = "novit/data/domains.yaml"
"config/profiles.yaml" = "novit/data/profiles.yaml"
"config/sources.yaml" = "novit/data/sources.yaml"

[tool.hatch.build.targets.sdist]
include = [
    "novit",
    "config/*.yaml",
    "tests",
    "README.md",
    "LICENSE",
    "VERSION",
    "CHANGELOG.md",
    "requirements.txt",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["novit"]
known_third_party = ["mcp"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["novit"]
known-third-party = ["mcp"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=novit --cov-report=term-missing"
